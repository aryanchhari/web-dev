<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .gridclass {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
       }

      div img {
        height: 100px;
        width: 200px;
        padding: 100px;
      }

    </style>
  </head>
  <body>
    <div class="gridclass">
      <img src="images 1.jpg"/>
      <img src="images 2.jpg"/>
      <img src="images3.jpg"/>
      <img src="images4.jpg"/>
      <img src="images5.jpg"/>
      <img src="images6.jpg"/>
    </div>
  </body>
</html>
