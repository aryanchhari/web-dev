<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Registration page!</h1>
    <br />
    <hr />
    <br />
    <h3>Fill the form below</h3>
    <hr />
    <br />
    <form action="">
      <label for="">Name -</label>
      <input type="text" placeholder="Enter your name" required />
      <br />
      <label for="">Email - </label>
      <input type="email" placeholder="aryanzig@gmail.com" required />
      <br />
      <label for="">Phone </label> <br />
      <label for="">number -</label>
      <input type="number" placeholder="123456789" required />
      <br /><br />
      <label for="">Address - </label>
      <textarea cols="10" rows="4" placeholder="A wing - 672,isteria co-op colony,mahada,mumbai 200118"></textarea> 
      <br>
      <label for="">Password: </label>
      <input type="password" placeholder="ABC@XYZ" required>
      <br>
      <label for="">Confirm password: </label>
      <input type="password" required placeholder="ABC@123">
      <br />
      <hr />
      <label for="">Select Gender:</label>
      <input type="radio" />
      <label for="">male</label>
      <input type="radio" />
      <label for="">Female</label>
      <input type="radio" />
      <label for="">Prefer not to say</label>
      <br /><br />
      <hr />
      <label for="">Select language:</label> <br />
      <br />
      <label for=""> JAVA</label>
      <input type="checkbox" />
      <br />
      <label for=""> HTML</label>
      <input type="checkbox" />
      <br />
      <label for=""> JAVASCRIPT</label>
      <input type="checkbox" />
      <br />
      <label for=""> python</label>
      <input type="checkbox" />
      <br />
      <hr />
      <label for="">Select course:</label>
      <select name="" id="">
        <option value="">Select</option>
        <option value="">WEB dev</option>
        <option value="">Full stack</option>
        <option value="">Front end</option>
        <option value="">Back end</option>
      </select>
      <br /><br />
      <label for="">Select DOB: </label>
      <input type="date" />
      <br /><br />
      <label for="">Select file: </label>
      <input type="file" />
      <br />
      <br />

      <input type="submit"  /> <input type="reset">
    </form>
  </body>
</html>
