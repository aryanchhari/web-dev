<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
        body {
            margin: 0;
        }

        .login-box {
            background-color: #F1E7BA;
            width: 350px;
            padding: 30px;
            margin: 200px auto;
        }

        label {
            color: white;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 10px;
            margin-bottom: 25px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            background-color: #E84420;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 20px;
            font-size: 18px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <form>
            <label>Enter Username:</label>
            <input type="email" placeholder="Enter email ID">

            <label>Enter Password:</label>
            <input type="password" placeholder="Password here">

            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
