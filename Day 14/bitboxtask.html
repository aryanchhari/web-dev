<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Black{
            background-color:black ;
            top: 0%;
            bottom: 92%;
            left: 0%;
            right: 0%;
            position: fixed;
            font-weight: bold
        }


        #Underline a {
            text-decoration: none;
            display: inline-block;
            color: white;
            display: inline-block;
            position: fixed;
            right: 3%;
            top: 3.2%;
            word-spacing: 10px;
            font-size: large;
        }

        .block {
            display: inline-block;
            font-size: xx-large;
            padding-left: 20px;
        }
    </style>
</head>
<body>
    

    <div class="block Black">
        <p style="color: white">Bit<span style="color: red;">Box</span></p>
    </div>

    <div id="Underline">
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Contact</a>
        <a href="">Login</a>
        <a href="">Signup</a>
    </div>
    
</body>
</html>
