<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .row {
        display: flex;
        flex-direction: row;
        justify-content: space-evenly;
        align-items: center;
        height: 100vh;
        transition: all 1s ease;
      }

      .row img:hover{
         transform: scale(1.4,2.3);
         transition: all 1s ease;

      }
    </style>
  </head>
  <body>
    <div class="row">
      <img src="fries.png" alt="" />
      <img src="momos.png" alt="" />
      <img src="paneer-pizza-card3.png" alt="" />
      <img src="pizza-card2.png" alt="" />
    </div>
  </body>
</html>
