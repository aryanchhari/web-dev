<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Holiday | Booking</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    >
  </head>
  <body id="top" class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <nav class="navbar navbar-expand bg-dark shadow-sm py-3" data-bs-theme="dark">
      <div class="container flex-column flex-lg-row gap-3">
        <a class="navbar-brand fw-bold fs-3" href="index.html">
          Holiday<span class="text-warning">.</span>
        </a>
        <ul class="navbar-nav flex-row flex-wrap justify-content-center gap-3 ms-lg-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="destination.html">Destinations</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="destination.html#packages">Packages</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="booking.html">Booking</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contact.html">Contact</a>
          </li>
        </ul>
        <a class="btn btn-warning fw-semibold ms-lg-4 px-4 rounded-pill" href="signup.html">
          Sign up
        </a>
      </div>
    </nav>

    <main class="flex-grow-1 py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card border-0 rounded-4 shadow-sm">
              <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                  <p class="small fw-bold text-uppercase text-warning-emphasis mb-2">Your next escape</p>
                  <h1 class="h2 fw-bold mb-2">Plan your holiday</h1>
                  <p class="text-body-secondary mb-0">Share your details and tell us about your trip.</p>
                </div>

                <!-- Connect this POST form to a booking service when the backend is ready. -->
                <form id="bookingForm" action="#" method="post">
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label for="fullName" class="form-label">Full name</label>
                      <input
                        class="form-control"
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Your full name"
                        autocomplete="name"
                        pattern=".*\S.*"
                        maxlength="100"
                        required
                      >
                    </div>
                    <div class="col-md-6">
                      <label for="email" class="form-label">Email address</label>
                      <input
                        class="form-control"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="name@example.com"
                        autocomplete="email"
                        required
                      >
                    </div>
                    <div class="col-md-6">
                      <label for="destination" class="form-label">Select destination</label>
                      <select class="form-select" id="destination" name="destination" required>
                        <option value="" selected disabled>Choose a destination</option>
                        <option value="Agra">Agra</option>
                        <option value="Tokyo">Tokyo</option>
                        <option value="Paris">Paris</option>
                      </select>
                    </div>
                    <div class="col-md-6">
                      <label for="travelDate" class="form-label">Departure date</label>
                      <input class="form-control" type="date" id="travelDate" name="travelDate" required>
                    </div>
                    <div class="col-md-6">
                      <label for="travellers" class="form-label">Number of people</label>
                      <input
                        class="form-control"
                        type="number"
                        id="travellers"
                        name="travellers"
                        value="1"
                        min="1"
                        step="1"
                        required
                      >
                    </div>
                    <div class="col-12">
                      <label for="tripNotes" class="form-label">
                        Description <span class="small text-body-secondary">(optional)</span>
                      </label>
                      <textarea
                        class="form-control"
                        id="tripNotes"
                        name="tripNotes"
                        rows="3"
                        maxlength="1000"
                        placeholder="Tell us about your trip"
                      ></textarea>
                    </div>
                  </div>
                  <p class="small text-body-secondary mt-4 mb-3">
                  </p>
                  <button class="btn btn-warning rounded-pill fw-semibold w-100 py-2" type="submit">
                    Submit booking request
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-white border-top py-4">
      <div class="container">
        <div
          class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3"
        >
          <a class="fs-4 fw-bold text-dark text-decoration-none" href="index.html">
            Holiday<span class="text-warning-emphasis">.</span>
          </a>
          <nav class="nav justify-content-center" aria-label="Footer navigation">
            <a class="nav-link px-2 link-secondary" href="destination.html">Destinations</a>
            <a class="nav-link px-2 link-secondary" href="destination.html#packages">Packages</a>
            <a class="nav-link px-2 link-secondary" href="index.html">Home</a>
            <a class="nav-link px-2 link-secondary" href="index.html#why-holiday">About</a>
            <a class="nav-link px-2 link-secondary" href="#top">
              Back to top <span aria-hidden="true">&uarr;</span>
            </a>
          </nav>
        </div>
        <p class="small text-body-secondary text-center text-md-start border-top pt-3 mt-3 mb-0">
          &copy; 2026 Holiday. Designed by Aryan with Bootstrap.
        </p>
      </div>
    </footer>
  </body>
</html>
