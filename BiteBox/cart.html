<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="rework.css">
     <script
      src="https://kit.fontawesome.com/cc2092efaa.js"
      crossorigin="anonymous"
    ></script>
</head>
<body>
     <header>
      
      <img src="Images/Bitebox.png" alt="BiteBox Logo" class="logoclass" />

      <nav>
        
        <a href="">Home</a>
        <a href="">Menu</a>
        <a href="">BiteDeals</a>
        <a href=""><i class="fa-solid fa-cart-shopping"></i></a>
        <a href=""><i class="fa-solid fa-arrow-right-to-bracket"></i>Login</a>
      </nav>
    </header>

    <main class="cart">
        <h1>Your cart</h1>

        <table>
            <thead>
                <tr>
                    <th scope="col">Item</th>
                    <th scope="col">Price</th>
                    <th scope="col">Qty</th>
                    <th scope="col">Total</th>
                    <th scope="col">Remove</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>
                        <div class="item">
                            <img src="Images/bugerri.jpg" alt="Cheese Burger">
                            <div>
                                <h3>Cheese Burger</h3>
                                <p>Juicy grilled burger</p>
                            </div>
                        </div>
                    </td>
                    <td>₹199</td>
                    <td>
                        <div class="quantity">
                            <button type="button">−</button>
                            <span>1</span>
                            <button type="button">+</button>
                        </div>
                    </td>
                    <td>₹199</td>
                    <td>
                        <button type="button">Remove</button>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div class="item">
                            <img src="Images/panner.jpg" alt="Capsicum Pizza">
                            <div>
                                <h3>Capsicum Pizza</h3>
                                <p>Loaded with cheese</p>
                            </div>
                        </div>
                    </td>
                    <td>₹249</td>
                    <td>
                        <div class="quantity">
                            <button type="button">−</button>
                            <span>1</span>
                            <button type="button">+</button>
                        </div>
                    </td>
                    <td>₹249</td>
                    <td>
                        <button type="button">Remove</button>
                    </td>
                </tr>

                <tr>
                    <td>
                        <div class="item">
                            <img src="Images/pasta.jpg" alt="Alfredo Pasta">
                            <div>
                                <h3>Alfredo Pasta</h3>
                                <p>Creamy white sauce</p>
                            </div>
                        </div>
                    </td>
                    <td>₹229</td>
                    <td>
                        <div class="quantity">
                            <button type="button">−</button>
                            <span>1</span>
                            <button type="button">+</button>
                        </div>
                    </td>
                    <td>₹229</td>
                    <td>
                        <button type="button">Remove</button>
                    </td>
                </tr>
            </tbody>

            <tfoot>
                <tr>
                    <th scope="row" colspan="3">Grand Total</th>
                    <td>₹677</td>
                    <td>
                        <button type="button">Proceed</button>
                    </td>
                </tr>
            </tfoot>
        </table>
    </main>

   
</body>
</html>
