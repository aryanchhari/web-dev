<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
         for( i=1 ; i<=10 ; i++){
         document.write("Aryan <br> ");
         }

         for( a=1 ; a<=10 ; a++){
        document.write( a , "<br>");
        }

         for( b=10 ; b>=0 ; i--){
        document.write(b , "<br>");
        }

         for( c =100 ; c>=90 ; c--){
        document.write( c ,"<br> ");
        }

         for( d =100 ; d>=90 ; d=d+2){
        document.write( d ,"<br> ");
        }


       

        
    </script>
</body>
</html>
