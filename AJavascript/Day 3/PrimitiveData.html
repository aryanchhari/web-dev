<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let age =20;
        console.log(age, typeof age); //number

         let la ="Aryan";   //string
        console.log(la, typeof la);

         let laa =324234242424.242424242427462378426342746247;  //number
        console.log(laa, typeof laa);

         let laaa =23442423424242432n;     //Big int
        console.log(laaa, typeof laaa);

         let laaaa =true;                  //boolean
        console.log(laaaa, typeof laaaa);

        
         let laaaaa                  //undefined
        console.log(laaaaa, typeof laaaaa);

        
         laaaaaa=Symbol("id")                  //symbol
        console.log(laaaaaa, typeof laaaaaa);

    </script>
</body>
</html>
