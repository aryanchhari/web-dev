<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 3;

        switch(a){
            case 1:
                document.write("This is 1");
                break;

            case 2:
            document.write("This is 2");
            break;

            case 3:
            document.write("This is 3");
            break;

            default:
                document.write("invalid");
        }

    </script>
</body>
</html>
